<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marsha Walungua — Homelab</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #020617;
      min-height: 100vh;
      padding: 1.5rem;
      color: white;
    }
    .container { max-width: 1100px; margin: 0 auto; }
    .header { margin-bottom: 1.2rem; }
    .header-row { display: flex; align-items: center; gap: 0.8rem; margin-bottom: 0.2rem; }
    .pulse-dot {
      width: 10px; height: 10px; background: #06b6d4; border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    h1 { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.02em; }
    .subtitle { color: #94a3b8; font-size: 0.85rem; margin-left: 1.6rem; }
    .diagram-container {
      background: rgba(15, 23, 42, 0.4);
      border-radius: 1rem;
      border: 1px solid #1e293b;
      padding: 1rem;
    }
    svg { width: 100%; display: block; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .footer { text-align: center; margin-top: 0.8rem; color: #475569; font-size: 0.75rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-row">
        <div class="pulse-dot"></div>
        <h1>Marsha Walungua · Homelab</h1>
      </div>
      <p class="subtitle">Multi-node lab — Tailscale mesh + local switch</p>
    </div>

    <div class="diagram-container">
      <svg viewBox="0 0 1100 580" style="font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
        <defs>
          <marker id="a-violet" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
            <polygon points="0 0, 10 4, 0 8" fill="#a78bfa"/>
          </marker>
          <marker id="a-slate" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
            <polygon points="0 0, 10 4, 0 8" fill="#64748b"/>
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#0a0e17"/>

        <!-- ZONE TAILSCALE -->
        <rect x="40" y="30" width="490" height="330" rx="12" fill="rgba(6,182,212,0.04)" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="8,5"/>
        <text x="285" y="62" fill="#22d3ee" font-size="15" font-weight="700" letter-spacing="3" text-anchor="middle">🔵 TAILSCALE</text>

        <!-- ThinkPad -->
        <rect x="65" y="85" width="195" height="105" rx="8" fill="#111827" stroke="#fb7185" stroke-width="1.5"/>
        <text x="162" y="115" fill="white" font-size="15" font-weight="700" text-anchor="middle">💻 ThinkPad</text>
        <text x="162" y="138" fill="#94a3b8" font-size="12" text-anchor="middle">NixOS + Hexegol</text>
        <text x="162" y="158" fill="#94a3b8" font-size="12" text-anchor="middle">16 GB RAM</text>
        <text x="162" y="180" fill="#fb7185" font-size="11" font-weight="600" text-anchor="middle">🔎 Pentesting</text>

        <!-- MacBook Air -->
        <rect x="310" y="85" width="195" height="105" rx="8" fill="#111827" stroke="#34d399" stroke-width="1.5"/>
        <text x="407" y="115" fill="white" font-size="15" font-weight="700" text-anchor="middle">🍏 MacBook Air M2</text>
        <text x="407" y="138" fill="#94a3b8" font-size="12" text-anchor="middle">8 GB RAM</text>
        <text x="407" y="158" fill="#94a3b8" font-size="12" text-anchor="middle">Daily Driver</text>
        <text x="407" y="180" fill="#34d399" font-size="11" font-weight="600" text-anchor="middle">📓 Anki · Obsidian</text>

        <!-- NixOS - Hermes -->
        <rect x="65" y="235" width="440" height="95" rx="10" fill="#1a1a2e" stroke="#a78bfa" stroke-width="2"/>
        <text x="285" y="268" fill="white" font-size="16" font-weight="700" text-anchor="middle">🖧 NixOS — Hermes</text>
        <text x="285" y="292" fill="#94a3b8" font-size="12" text-anchor="middle">4 GB RAM</text>
        <text x="285" y="316" fill="#a78bfa" font-size="12" font-weight="700" text-anchor="middle">⚡ Pont vers le réseau local</text>

        <!-- ZONE LOCAL -->
        <rect x="560" y="30" width="500" height="280" rx="12" fill="rgba(251,191,36,0.04)" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="8,5"/>
        <text x="810" y="62" fill="#fbbf24" font-size="15" font-weight="700" letter-spacing="3" text-anchor="middle">🟡 RÉSEAU LOCAL</text>

        <!-- Switch -->
        <rect x="720" y="85" width="180" height="50" rx="8" fill="rgba(251,191,36,0.08)" stroke="#fbbf24" stroke-width="1.5"/>
        <text x="810" y="116" fill="white" font-size="15" font-weight="600" text-anchor="middle">🔌 Switch</text>

        <!-- Proxmox -->
        <rect x="590" y="185" width="200" height="105" rx="8" fill="#111827" stroke="#fbbf24" stroke-width="1.5"/>
        <text x="690" y="215" fill="white" font-size="15" font-weight="700" text-anchor="middle">🖥️ Proxmox</text>
        <text x="690" y="240" fill="#94a3b8" font-size="12" text-anchor="middle">Mini PC · 8 GB RAM</text>
        <text x="690" y="260" fill="#94a3b8" font-size="12" text-anchor="middle">Containers &amp; VMs</text>

        <!-- Old MacBook -->
        <rect x="830" y="185" width="200" height="105" rx="8" fill="#111827" stroke="#64748b" stroke-width="1.5"/>
        <text x="930" y="215" fill="white" font-size="15" font-weight="700" text-anchor="middle">💻 Old MacBook</text>
        <text x="930" y="240" fill="#94a3b8" font-size="12" text-anchor="middle">Antix OS</text>
        <text x="930" y="260" fill="#94a3b8" font-size="12" text-anchor="middle">Lightweight Linux</text>
        <text x="930" y="282" fill="#64748b" font-size="11" font-weight="600" text-anchor="middle">🧪 Expérimentations</text>

        <!-- Bridge arrow: NixOS → Switch -->
        <line x1="505" y1="282" x2="545" y2="282" stroke="#a78bfa" stroke-width="2.5"/>
        <line x1="545" y1="282" x2="545" y2="110" stroke="#a78bfa" stroke-width="2.5"/>
        <line x1="545" y1="110" x2="718" y2="110" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#a-violet)"/>

        <!-- INTERNET -->
        <rect x="200" y="460" width="340" height="60" rx="8" fill="#111827" stroke="#64748b" stroke-width="1.5"/>
        <text x="370" y="490" fill="white" font-size="15" font-weight="700" text-anchor="middle">🌐 Internet</text>
        <text x="370" y="510" fill="#64748b" font-size="12" text-anchor="middle">GitHub Pages · Root-Me</text>

        <!-- VPS INFOMANIAK -->
        <rect x="750" y="450" width="300" height="80" rx="8" fill="#111827" stroke="#06b6d4" stroke-width="1.5"/>
        <text x="900" y="478" fill="white" font-size="14" font-weight="700" text-anchor="middle">☁️ VPS Lite Infomaniak</text>
        <text x="900" y="500" fill="#94a3b8" font-size="11" text-anchor="middle">Site web personnel · Gitea</text>
        <text x="900" y="518" fill="#06b6d4" font-size="10" font-weight="600" text-anchor="middle">Hébergement externe</text>

        <!-- Internet ↔ VPS -->
        <line x1="540" y1="490" x2="748" y2="490" stroke="#64748b" stroke-width="1.5"/>

        <!-- HTTPS → Tailscale -->
        <line x1="200" y1="490" x2="120" y2="490" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6,4"/>
        <line x1="120" y1="490" x2="120" y2="362" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#a-slate)"/>
        <rect x="90" y="418" width="60" height="24" rx="4" fill="#0a0e17" stroke="#64748b" stroke-width="1"/>
        <text x="120" y="435" fill="#64748b" font-size="13" font-weight="700" text-anchor="middle">HTTPS</text>
      </svg>
    </div>

    <p class="footer">Marsha Walungua · Homelab · 2026</p>
  </div>
</body>
</html>
