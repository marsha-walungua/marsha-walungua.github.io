<svg viewBox="0 0 1100 580">
        <defs>
          <marker id="a-violet" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
            <polygon points="0 0, 10 4, 0 8" fill="#a78bfa"/>
          </marker>
          <marker id="a-slate" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
            <polygon points="0 0, 10 4, 0 8" fill="#64748b"/>
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#0a0e17"/>

        <!-- ===== ZONE TAILSCALE ===== -->
        <rect x="40" y="30" width="490" height="330" rx="12" fill="rgba(6,182,212,0.04)" stroke="#22d3ee" stroke-width="2" stroke-dasharray="8,5"/>
        <text x="285" y="62" fill="#22d3ee" font-size="18" font-weight="700" text-anchor="middle">TAILSCALE MESH</text>

        <!-- ThinkPad -->
        <rect x="70" y="90" width="190" height="100" rx="8" fill="#111827" stroke="#fb7185" stroke-width="2"/>
        <text x="165" y="120" fill="white" font-size="16" font-weight="700" text-anchor="middle">ThinkPad</text>
        <text x="165" y="145" fill="#94a3b8" font-size="13" text-anchor="middle">NixOS + Hexegol</text>
        <text x="165" y="165" fill="#94a3b8" font-size="13" text-anchor="middle">16 GB RAM</text>
        <text x="165" y="185" fill="#fb7185" font-size="12" text-anchor="middle">Pentesting</text>

        <!-- MacBook Air -->
        <rect x="310" y="90" width="190" height="100" rx="8" fill="#111827" stroke="#34d399" stroke-width="2"/>
        <text x="405" y="120" fill="white" font-size="16" font-weight="700" text-anchor="middle">MacBook Air M2</text>
        <text x="405" y="145" fill="#94a3b8" font-size="13" text-anchor="middle">8 GB RAM</text>
        <text x="405" y="165" fill="#94a3b8" font-size="13" text-anchor="middle">Daily Driver</text>
        <text x="405" y="185" fill="#34d399" font-size="12" text-anchor="middle">Anki · Obsidian</text>

        <!-- ===== NixOS - Hermes (dans Tailscale) ===== -->
        <rect x="70" y="240" width="430" height="90" rx="10" fill="#1a1a2e" stroke="#a78bfa" stroke-width="3"/>
        <text x="285" y="272" fill="white" font-size="16" font-weight="700" text-anchor="middle">NixOS — Hermes</text>
        <text x="285" y="295" fill="#94a3b8" font-size="13" text-anchor="middle">4 GB RAM · Pont vers le réseau local</text>
        <text x="285" y="318" fill="#a78bfa" font-size="13" font-weight="700" text-anchor="middle">⚡ BRIDGE</text>

        <!-- ===== ZONE LOCAL ===== -->
        <rect x="560" y="30" width="500" height="280" rx="12" fill="rgba(251,191,36,0.03)" stroke="#fbbf24" stroke-width="2" stroke-dasharray="8,5"/>
        <text x="810" y="62" fill="#fbbf24" font-size="18" font-weight="700" text-anchor="middle">RÉSEAU LOCAL</text>

        <!-- Switch -->
        <rect x="720" y="90" width="180" height="50" rx="8" fill="rgba(251,191,36,0.08)" stroke="#fbbf24" stroke-width="2"/>
        <text x="810" y="122" fill="white" font-size="16" font-weight="600" text-anchor="middle">🔌 Switch</text>

        <!-- Proxmox -->
        <rect x="590" y="190" width="200" height="100" rx="8" fill="#111827" stroke="#fbbf24" stroke-width="2"/>
        <text x="690" y="220" fill="white" font-size="16" font-weight="700" text-anchor="middle">Proxmox</text>
        <text x="690" y="245" fill="#94a3b8" font-size="13" text-anchor="middle">Mini PC · 8 GB RAM</text>
        <text x="690" y="265" fill="#fbbf24" font-size="12" text-anchor="middle">Containers · VMs</text>

        <!-- Old MacBook -->
        <rect x="830" y="190" width="200" height="100" rx="8" fill="#111827" stroke="#64748b" stroke-width="2"/>
        <text x="930" y="220" fill="white" font-size="16" font-weight="700" text-anchor="middle">Old MacBook</text>
        <text x="930" y="245" fill="#94a3b8" font-size="13" text-anchor="middle">Antix OS</text>
        <text x="930" y="265" fill="#64748b" font-size="12" text-anchor="middle">Expérimentations</text>

        <!-- ===== FLÈCHE BRIDGE : NixOS → Switch ===== -->
        <!-- Du bord droit de NixOS (x=500), vers la droite dans l'espace entre les zones (x=545),
             puis vers le haut, puis vers la gauche du Switch (x=718) -->
        <line x1="500" y1="285" x2="545" y2="285" stroke="#a78bfa" stroke-width="3"/>
        <line x1="545" y1="285" x2="545" y2="115" stroke="#a78bfa" stroke-width="3"/>
        <line x1="545" y1="115" x2="718" y2="115" stroke="#a78bfa" stroke-width="3" marker-end="url(#a-violet)"/>

        <!-- ===== INTERNET ===== -->
        <rect x="200" y="460" width="340" height="60" rx="8" fill="#111827" stroke="#64748b" stroke-width="2"/>
        <text x="370" y="490" fill="white" font-size="16" font-weight="700" text-anchor="middle">🌐 Internet</text>
        <text x="370" y="510" fill="#64748b" font-size="13" text-anchor="middle">GitHub Pages · Root-Me</text>

        <!-- ===== VPS INFOMANIAK ===== -->
        <rect x="750" y="450" width="300" height="80" rx="8" fill="#111827" stroke="#22d3ee" stroke-width="2"/>
        <text x="900" y="478" fill="white" font-size="14" font-weight="700" text-anchor="middle">VPS Lite Infomaniak</text>
        <text x="900" y="500" fill="#94a3b8" font-size="11" text-anchor="middle">Site web personnel · Gitea</text>
        <text x="900" y="518" fill="#22d3ee" font-size="10" text-anchor="middle">Hébergement externe</text>

        <!-- Internet ↔ VPS -->
        <line x1="540" y1="490" x2="748" y2="490" stroke="#64748b" stroke-width="2"/>

        <!-- HTTPS → Tailscale (gauche) -->
        <line x1="200" y1="490" x2="130" y2="490" stroke="#64748b" stroke-width="2" stroke-dasharray="6,4"/>
        <line x1="130" y1="490" x2="130" y2="362" stroke="#64748b" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#a-slate)"/>
        <rect x="100" y="420" width="60" height="24" rx="4" fill="#0a0e17" stroke="#64748b" stroke-width="1.5"/>
        <text x="130" y="437" fill="#64748b" font-size="14" font-weight="700" text-anchor="middle">HTTPS</text>
      </svg>